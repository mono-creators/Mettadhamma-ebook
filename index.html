<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมตตาธรรม ธรรมคำสอน หลวงปู่แบน ธนากโร | Mettadhamma</title>
    <style>
        body {
            background-color: #222;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }
        #flipbook {
            width: 900px;
            height: 600px;
        }
        #flipbook .page {
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
            width: 100%;
        }

        /* ปรับให้รองรับหน้าจอ มือถือ / แท็บเล็ต อัตโนมัติ */
        @media screen and (max-width: 950px) {
            #flipbook {
                width: 100% !important;
                height: 70vh !important;
            }
        }
    </style>
    <!-- โหลด jQuery และ Turn.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
</head>
<body>

    <div id="flipbook">
        <!-- ระบบจะดึงรูปภาพจากโฟลเดอร์ images มาแสดงอัตโนมัติ 100 หน้า -->
    </div>

    <div class="instructions">คลิกหรือใช้นิ้วปัด/กดมุมกระดาษเพื่อพลิกหน้า</div>

    <script>
        // สร้างหน้าหนังสือ 100 หน้าอัตโนมัติ
        for (let i = 1; i <= 100; i++) {
            $('#flipbook').append('<div class="page"><img src="images/' + i + '.jpg" alt="Page ' + i + '"></div>');
        }

        $(document).ready(function() {
            $('#flipbook').turn({
                width: 900,
                height: 600,
                autoCenter: true,
                gradients: true
            });
        });

        // ควบคุมด้วยคีย์บอร์ดลูกศรซ้าย-ขวา (สำหรับคอมพิวเตอร์)
        $(keydown = function(e) {
            if (e.keyCode == 37) {
                $('#flipbook').turn('previous');
            } else if (e.keyCode == 39) {
                $('#flipbook').turn('next');
            }
        });
    </script>

</body>
</html>
